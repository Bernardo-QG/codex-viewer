<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />
        <script src="assets/js/tema.js"></script>

        <link rel="stylesheet" href="assets/css/styles.css" />
        <link rel="stylesheet" href="assets/css/admin.css" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <meta name="theme-color" content="#F6F7F8" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1C1F20" media="(prefers-color-scheme: dark)" />

        <!-- EasyMDE editor de markdown -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />

        <title>Admin — Codex</title>
    </head>
    <body>
        <nav aria-label="Principal">
            <a href="./" class="nav_brand">CODEX</a>
            <a href="admin.html" class="nav_link">Admin</a>
            <button class="theme_toggle" id="theme_toggle" type="button" aria-label="Cambiar tema">
                <svg class="icon_sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                    />
                </svg>
                <svg class="icon_moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </nav>

        <div class="admin_layout">
            <aside class="admin_sidebar">
                <div class="admin_tabs" role="tablist" aria-label="Qué administrar">
                    <button type="button" role="tab" data-vista="documentos" aria-selected="true">Documentos</button>
                    <button type="button" role="tab" data-vista="secciones" aria-selected="false" class="extendido">
                        Secciones
                    </button>
                    <button type="button" role="tab" data-vista="etiquetas" aria-selected="false" class="extendido">
                        Etiquetas
                    </button>
                </div>

                <div class="admin_panel" data-panel="documentos">
                    <button class="btn btn_primary" id="btn_nuevo">+ Nuevo documento</button>
                    <ul class="admin_list" id="document_list"></ul>
                </div>

                <div class="admin_panel" data-panel="secciones" hidden>
                    <button class="btn btn_primary" id="btn_nueva_seccion">+ Nueva sección</button>
                    <ul class="admin_list" id="lista_secciones"></ul>
                </div>

                <div class="admin_panel" data-panel="etiquetas" hidden>
                    <button class="btn btn_primary" id="btn_nueva_etiqueta">+ Nueva etiqueta</button>
                    <ul class="admin_list" id="lista_etiquetas_admin"></ul>
                    <button class="btn btn_secondary" id="btn_limpiar_etiquetas" hidden>Quitar etiquetas sin uso</button>
                </div>
            </aside>

            <!-- Formulario de edicion -->
            <main class="admin_main">
                <div data-panel="documentos">
                <p class="admin_notice" id="aviso_migracion" hidden>
                    Faltan las columnas y tablas nuevas. Ejecuta
                    <code>db/migrations/2026-11-21_secciones_etiquetas_estado.sql</code> en Supabase para usar
                    secciones, etiquetas, estado y resumen.
                </p>
                <form class="admin_form" id="form_documento">
                    <div class="form_group">
                        <label for="input_title">Título</label>
                        <input type="text" id="input_title" placeholder="Título del documento" required />
                    </div>
                    <div class="form_row">
                        <div class="form_group">
                            <label for="input_slug">Slug</label>
                            <input
                                type="text"
                                id="input_slug"
                                placeholder="mi-documento"
                                pattern="[a-z0-9]+(-[a-z0-9]+)*"
                                required
                            />
                        </div>
                        <div class="form_group form_group_medium extendido">
                            <label for="input_status">Estado</label>
                            <select id="input_status">
                                <option value="published">Publicado</option>
                                <option value="draft">Borrador</option>
                            </select>
                        </div>
                    </div>
                    <div class="form_group extendido">
                        <label for="input_summary">Resumen <span class="form_hint" id="contador_resumen">0/300</span></label>
                        <textarea
                            id="input_summary"
                            rows="2"
                            maxlength="300"
                            placeholder="Una o dos líneas: se muestra bajo el título y al compartir el enlace"
                        ></textarea>
                    </div>
                    <div class="form_row extendido">
                        <div class="form_group">
                            <label for="input_category">Sección</label>
                            <select id="input_category">
                                <option value="">Sin sección</option>
                            </select>
                        </div>
                        <div class="form_group form_group_small">
                            <label for="input_order">Orden</label>
                            <input type="number" id="input_order" value="0" step="1" />
                        </div>
                    </div>
                    <div class="form_group extendido">
                        <label for="input_tags">Etiquetas <span class="form_hint">separadas por coma</span></label>
                        <input type="text" id="input_tags" list="lista_etiquetas" placeholder="git, sql, angular" />
                        <datalist id="lista_etiquetas"></datalist>
                    </div>
                    <div class="form_group form_group_editor">
                        <label for="input_content">Contenido (Markdown)</label>
                        <textarea id="input_content"></textarea>
                    </div>
                    <div class="form_actions">
                        <button type="submit" class="btn btn_primary" id="btn_guardar">Guardar</button>
                        <button type="button" class="btn btn_danger" id="btn_eliminar" hidden>Eliminar</button>
                        <a class="form_link" id="link_ver" target="_blank" rel="noopener" hidden>Ver ↗</a>
                        <span class="form_status" id="form_status" role="status"></span>
                    </div>
                </form>
                </div>

                <!-- Secciones -->
                <div data-panel="secciones" hidden>
                    <form class="admin_form" id="form_seccion">
                        <h2 class="admin_form_title" id="titulo_seccion">Nueva sección</h2>
                        <div class="form_row">
                            <div class="form_group">
                                <label for="seccion_nombre">Nombre</label>
                                <input type="text" id="seccion_nombre" placeholder="Backend" required />
                            </div>
                            <div class="form_group">
                                <label for="seccion_slug">Slug</label>
                                <input type="text" id="seccion_slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required />
                            </div>
                        </div>
                        <div class="form_row">
                            <div class="form_group">
                                <label for="seccion_padre">Dentro de</label>
                                <select id="seccion_padre"></select>
                            </div>
                            <div class="form_group form_group_small">
                                <label for="seccion_orden">Orden</label>
                                <input type="number" id="seccion_orden" value="0" step="1" />
                            </div>
                        </div>
                        <div class="form_group">
                            <label for="seccion_descripcion">Descripción <span class="form_hint">opcional</span></label>
                            <textarea id="seccion_descripcion" rows="2" placeholder="De qué trata esta sección"></textarea>
                        </div>
                        <p class="form_info" id="info_seccion"></p>
                        <div class="form_actions">
                            <button type="submit" class="btn btn_primary" id="btn_guardar_seccion">Crear sección</button>
                            <button type="button" class="btn btn_danger" id="btn_eliminar_seccion" hidden>Eliminar</button>
                            <span class="form_status" id="estado_seccion" role="status"></span>
                        </div>
                    </form>
                </div>

                <!-- Etiquetas -->
                <div data-panel="etiquetas" hidden>
                    <form class="admin_form" id="form_etiqueta">
                        <h2 class="admin_form_title" id="titulo_etiqueta">Nueva etiqueta</h2>
                        <div class="form_row">
                            <div class="form_group">
                                <label for="etiqueta_nombre">Nombre</label>
                                <input type="text" id="etiqueta_nombre" placeholder="git" required />
                            </div>
                            <div class="form_group">
                                <label for="etiqueta_slug">Slug</label>
                                <input type="text" id="etiqueta_slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required />
                            </div>
                        </div>
                        <p class="form_info" id="info_etiqueta"></p>
                        <div class="form_actions">
                            <button type="submit" class="btn btn_primary" id="btn_guardar_etiqueta">Crear etiqueta</button>
                            <button type="button" class="btn btn_danger" id="btn_eliminar_etiqueta" hidden>Eliminar</button>
                            <span class="form_status" id="estado_etiqueta" role="status"></span>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
        <script type="module" src="assets/js/admin.js"></script>
    </body>
</html>
