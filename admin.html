<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="assets/css/styles.css" />
        <link rel="stylesheet" href="assets/css/admin.css" />
        <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/18334613?s=64&amp;v=4" />
        <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/18334613?s=180&amp;v=4" />

        <!-- EasyMDE editor de markdown -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />

        <title>Admin — Codex</title>
    </head>
    <body>
        <nav aria-label="Principal">
            <a href="./" class="nav_brand">CODEX</a>
            <a href="admin.html" class="nav_link">Admin</a>
        </nav>

        <div class="admin_layout">
            <!-- Lista de documentos -->
            <aside class="admin_sidebar">
                <h2 class="admin_sidebar_title">Documentos</h2>
                <button class="btn btn_primary" id="btn_nuevo">+ Nuevo</button>
                <ul class="admin_list" id="document_list"></ul>
            </aside>

            <!-- Formulario de edicion -->
            <main class="admin_main">
                <p class="admin_notice" id="aviso_migracion" hidden>
                    Faltan las columnas y tablas nuevas. Ejecuta
                    <code>db/migrations/2026-11-21_secciones_etiquetas_estado.sql</code> en Supabase para usar
                    secciones, etiquetas, estado y resumen.
                </p>
                <form class="admin_form" id="form_documento">
                    <div class="form_group">
                        <label for="input_title">Título</label>
                        <input type="text" id="input_title" placeholder="Título del documento" required />
                    </div>
                    <div class="form_row">
                        <div class="form_group">
                            <label for="input_slug">Slug</label>
                            <input
                                type="text"
                                id="input_slug"
                                placeholder="mi-documento"
                                pattern="[a-z0-9]+(-[a-z0-9]+)*"
                                required
                            />
                        </div>
                        <div class="form_group form_group_medium extendido">
                            <label for="input_status">Estado</label>
                            <select id="input_status">
                                <option value="published">Publicado</option>
                                <option value="draft">Borrador</option>
                            </select>
                        </div>
                    </div>
                    <div class="form_group extendido">
                        <label for="input_summary">Resumen <span class="form_hint" id="contador_resumen">0/300</span></label>
                        <textarea
                            id="input_summary"
                            rows="2"
                            maxlength="300"
                            placeholder="Una o dos líneas: se muestra bajo el título y al compartir el enlace"
                        ></textarea>
                    </div>
                    <div class="form_row extendido">
                        <div class="form_group">
                            <label for="input_category">Sección</label>
                            <select id="input_category">
                                <option value="">Sin sección</option>
                            </select>
                        </div>
                        <div class="form_group form_group_small">
                            <label for="input_order">Orden</label>
                            <input type="number" id="input_order" value="0" step="1" />
                        </div>
                    </div>
                    <div class="form_group extendido">
                        <label for="input_tags">Etiquetas <span class="form_hint">separadas por coma</span></label>
                        <input type="text" id="input_tags" list="lista_etiquetas" placeholder="git, sql, angular" />
                        <datalist id="lista_etiquetas"></datalist>
                    </div>
                    <div class="form_group form_group_editor">
                        <label for="input_content">Contenido (Markdown)</label>
                        <textarea id="input_content"></textarea>
                    </div>
                    <div class="form_actions">
                        <button type="submit" class="btn btn_primary" id="btn_guardar">Guardar</button>
                        <button type="button" class="btn btn_danger" id="btn_eliminar" hidden>Eliminar</button>
                        <a class="form_link" id="link_ver" target="_blank" rel="noopener" hidden>Ver ↗</a>
                        <span class="form_status" id="form_status" role="status"></span>
                    </div>
                </form>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js"></script>
        <script type="module" src="assets/js/admin.js"></script>
    </body>
</html>
