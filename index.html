<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Codex — notas y guías de desarrollo de Bernardo Quintino Guzmán" />
        <meta property="og:title" content="Codex" />
        <meta property="og:description" content="Notas y guías de desarrollo de Bernardo Quintino Guzmán" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://bernardo-qg.github.io/codex-viewer/" />
        <meta property="og:image" content="https://bernardo-qg.github.io/codex-viewer/assets/images/og-preview.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />

        <!-- Tema: se aplica antes de pintar para evitar parpadeo -->
        <script src="assets/js/tema.js"></script>

        <link rel="stylesheet" href="assets/css/styles.css" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <meta name="theme-color" content="#F6F7F8" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1C1F20" media="(prefers-color-scheme: dark)" />
        <link rel="preconnect" href="https://sakktuvkakmguzffqtwr.supabase.co" />

        <!-- zero-md para renderizar markdown -->
        <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>

        <title>Codex</title>
    </head>
    <body>
        <nav aria-label="Principal">
            <a href="./" class="nav_brand">CODEX</a>
            <button class="theme_toggle" id="theme_toggle" type="button" aria-label="Cambiar tema">
                <svg class="icon_sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                    />
                </svg>
                <svg class="icon_moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <div class="progress" id="progress" aria-hidden="true"></div>
        </nav>

        <div class="layout">
            <!-- Sidebar con lista de documentos -->
            <aside class="sidebar" id="sidebar">
                <button class="sidebar_toggle" id="sidebar_toggle" aria-label="Cerrar menu">✕</button>
                <h2 class="sidebar_title">Documentos</h2>
                <input
                    type="search"
                    class="sidebar_search"
                    id="search"
                    placeholder="Buscar o #etiqueta  ( / )"
                    aria-label="Buscar documentos"
                    autocomplete="off"
                />
                <ul class="sidebar_list" id="document_list"></ul>
            </aside>
            <div class="backdrop" id="backdrop" aria-hidden="true"></div>

            <!-- Contenido principal -->
            <main class="main">
                <div class="main_header">
                    <button class="menu_button" id="menu_button" aria-label="Abrir menu">☰</button>
                    <nav class="breadcrumb" id="document_path" aria-label="Sección" hidden></nav>
                </div>
                <h1 class="main_title" id="document_title"></h1>
                <p class="main_summary" id="document_summary" hidden></p>
                <div class="main_meta">
                    <ul class="doc_tags" id="document_tags" aria-label="Etiquetas" hidden></ul>
                    <p class="main_updated" id="document_updated" hidden></p>
                </div>
                <div class="loading" id="loading" role="status" aria-label="Cargando">
                    <span></span><span></span><span></span><span></span>
                </div>
                <zero-md id="content" manual-render hidden>
                    <!-- Reemplaza los estilos por defecto de zero-md: el tema completo vive en markdown-styles.css -->
                    <template>
                        <link rel="stylesheet" href="assets/css/markdown-styles.css" />
                    </template>
                </zero-md>

                <nav class="pager" id="pager" aria-label="Documento anterior y siguiente" hidden></nav>
            </main>

            <!-- Indice del documento -->
            <nav class="toc" id="toc" aria-label="En este documento" hidden>
                <h2 class="toc_title">En este documento</h2>
                <ul class="toc_list" id="toc_list"></ul>
            </nav>
        </div>

        <footer>
            <p>
                &copy; 2026
                <a href="https://github.com/Bernardo-QG" target="_blank" rel="noopener">Bernardo Quintino Guzmán</a>
            </p>
        </footer>

        <!-- Supabase -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script type="module" src="assets/js/api.js"></script>
    </body>
</html>
