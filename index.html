<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Codex — notas y guías de desarrollo de Bernardo Quintino Guzmán" />
        <meta property="og:title" content="Codex" />
        <meta property="og:description" content="Notas y guías de desarrollo de Bernardo Quintino Guzmán" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://bernardo-qg.github.io/codex-viewer/" />
        <meta property="og:image" content="https://avatars.githubusercontent.com/u/18334613?s=400&amp;v=4" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="assets/css/styles.css" />
        <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/18334613?s=64&amp;v=4" />
        <link rel="apple-touch-icon" href="https://avatars.githubusercontent.com/u/18334613?s=180&amp;v=4" />
        <link rel="preconnect" href="https://sakktuvkakmguzffqtwr.supabase.co" />

        <!-- zero-md para renderizar markdown -->
        <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>

        <title>Codex</title>
    </head>
    <body>
        <nav aria-label="Principal">
            <a href="./" class="nav_brand">CODEX</a>
        </nav>

        <div class="layout">
            <!-- Sidebar con lista de documentos -->
            <aside class="sidebar" id="sidebar">
                <button class="sidebar_toggle" id="sidebar_toggle" aria-label="Cerrar menu">✕</button>
                <h2 class="sidebar_title">Documentos</h2>
                <input
                    type="search"
                    class="sidebar_search"
                    id="search"
                    placeholder="Buscar…  ( / )"
                    aria-label="Buscar documentos"
                    autocomplete="off"
                />
                <ul class="sidebar_list" id="document_list"></ul>
            </aside>

            <!-- Contenido principal -->
            <main class="main">
                <div class="main_header">
                    <button class="menu_button" id="menu_button" aria-label="Abrir menu">☰</button>
                    <p class="main_slug" id="document_slug"></p>
                </div>
                <h1 class="main_title" id="document_title"></h1>
                <p class="main_updated" id="document_updated" hidden></p>
                <p class="loading" id="loading">Cargando...</p>
                <zero-md id="content" hidden>
                    <template data-append>
                        <link rel="stylesheet" href="assets/css/markdown-styles.css" />
                    </template>
                </zero-md>
            </main>

            <!-- Indice del documento -->
            <nav class="toc" id="toc" aria-label="En este documento" hidden>
                <h2 class="toc_title">En este documento</h2>
                <ul class="toc_list" id="toc_list"></ul>
            </nav>
        </div>

        <footer>
            <p>
                &copy; 2026
                <a href="https://github.com/Bernardo-QG" target="_blank" rel="noopener">Bernardo Quintino Guzmán</a>
            </p>
        </footer>

        <!-- Supabase -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script type="module" src="assets/js/api.js"></script>
    </body>
</html>
