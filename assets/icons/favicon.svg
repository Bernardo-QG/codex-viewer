<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Conjunto de hojas de un códice: hojas apiladas en azul maya, glifos en ocre -->
  <style>
    .fondo{fill:#1F7A80}.medio{fill:#3A9EA3}.pagina{fill:#4FB3B5}.linea{fill:#1F7A80}.glifo{fill:#D99A2B}
    @media (prefers-color-scheme: dark){.fondo{fill:#2E8F94}.medio{fill:#6CBFBD}.pagina{fill:#8AD4D2}.linea{fill:#2E8F94}.glifo{fill:#F2BE55}}
  </style>
  <rect class="fondo" x="20" y="4" width="34" height="44" rx="4" transform="rotate(10 37 26)"/>
  <rect class="medio" x="16" y="8" width="34" height="44" rx="4" transform="rotate(4 33 30)"/>
  <rect class="pagina" x="10" y="14" width="34" height="44" rx="4"/>
  <rect class="glifo" x="14" y="19" width="7" height="7" rx="2"/>
  <rect class="glifo" x="24" y="19" width="7" height="7" rx="2"/>
  <rect class="glifo" x="34" y="19" width="6" height="7" rx="2"/>
  <rect class="linea" x="14" y="30" width="26" height="2.5" rx="1.25"/>
  <rect class="glifo" x="14" y="36" width="14" height="8" rx="2.5"/>
  <rect class="glifo" x="31" y="36" width="9" height="8" rx="2.5"/>
  <rect class="linea" x="14" y="47" width="26" height="2.5" rx="1.25"/>
</svg>
